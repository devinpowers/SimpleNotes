name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild -project SimpleNotes.xcodeproj \
            -scheme SimpleNotes \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App
        run: |
          APP_PATH=$(find build/DerivedData -name "SimpleNotes.app" -type d | head -1)
          ditto -c -k --keepParent "$APP_PATH" SimpleNotes.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNotes
          path: SimpleNotes.zip

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Run Tests
        run: |
          xcodebuild test \
            -project SimpleNotes.xcodeproj \
            -scheme SimpleNotes \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: SimpleNotes

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename Artifact
        run: mv SimpleNotes.zip SimpleNotes-${{ steps.version.outputs.VERSION }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: SimpleNotes-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
          draft: false
